<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1445" />
    <meta name="description" content="Turn any photo into Van Gogh-style flowing brushwork, right in your browser." />
    <title>Starry</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Starry" />
  </head>
  <body>
    <main class="stage" id="stage">
      <canvas id="canvas" aria-label="Your picture, re-painted as flowing brushstrokes"></canvas>
      <p class="status" id="status" role="status" aria-live="polite">Reading the brushwork…</p>
      <div class="drop-hint" id="drop-hint">Drop a photo to paint it</div>
    </main>

    <section class="panel" id="panel" aria-label="Controls">
      <button type="button" class="panel-handle" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
        <span class="grip" aria-hidden="true"></span>
        <span>Controls</span>
      </button>
      <div class="panel-body" id="panel-body">
        <header class="panel-head">
          <h1>Starry</h1>
          <p>Any photo, re-painted as flowing brushwork.</p>
        </header>

        <div class="switch" role="group" aria-label="View">
          <button type="button" data-mode="paint" aria-pressed="true">Paint</button>
          <button type="button" data-mode="directions" aria-pressed="false">Directions</button>
        </div>

        <div class="knobs">
          <label class="knob">
            <span class="knob-label">Particles</span>
            <output class="knob-value" id="particles-out">4000</output>
            <input type="range" id="particles" min="500" max="20000" step="100" value="4000" />
          </label>
          <label class="knob">
            <span class="knob-label">Stroke length</span>
            <output class="knob-value" id="stroke-out">2.5 px</output>
            <input type="range" id="stroke" min="1" max="12" step="0.1" value="2.5" />
          </label>
          <label class="knob">
            <span class="knob-label">Color sharpness</span>
            <output class="knob-value" id="sharpness-out">80%</output>
            <input type="range" id="sharpness" min="0" max="100" step="1" value="80" />
          </label>
          <label class="knob">
            <span class="knob-label">Order</span>
            <output class="knob-value" id="order-out">100%</output>
            <input type="range" id="order" min="0" max="100" step="1" value="100" />
          </label>
        </div>

        <button type="button" class="btn-primary" id="choose">Choose photo</button>
        <div class="row">
          <button type="button" class="btn-secondary" id="save">Save image</button>
          <button type="button" class="btn-secondary" id="record">Record clip</button>
        </div>
        <div class="row quiet">
          <button type="button" class="btn-text" id="restart">Restart</button>
          <button type="button" class="btn-text" id="vangogh">Back to Van Gogh</button>
        </div>
        <input type="file" id="file" accept="image/*" hidden />
      </div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
